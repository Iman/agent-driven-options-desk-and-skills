<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="550px" preserveAspectRatio="none" style="width:811px;height:550px;background:#FFFFFF;" version="1.1" viewBox="0 0 811 550" width="811px" zoomAndPan="magnify"><?plantuml 1.2026.3?><defs/><g><g class="title" data-source-line="2"><rect fill="none" height="24" style="stroke:#000000;stroke-width:1;" width="349.9033" x="227.3382" y="5"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="339.9033" x="232.3382" y="20.7803">Option desk - One source of truth for four runtimes</text></g><!--entity skill--><g class="entity" data-qualified-name="skill" data-source-line="4" id="ent0002"><rect fill="#C6E9C6" height="74" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="184.9014" x="451.12" y="42"/><rect fill="#C6E9C6" height="10" style="stroke:#000000;stroke-width:1;" width="15" x="616.0214" y="47"/><rect fill="#C6E9C6" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="614.0214" y="49"/><rect fill="#C6E9C6" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="614.0214" y="53"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="108.2061" x="466.12" y="70.4702">shell/skills/*/SKILL.md</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="123.4976" x="466.12" y="81.4702">6 skills, each carrying the</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="143.0806" x="466.12" y="92.4702">reporting rules an agent must</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="144.9014" x="466.12" y="103.4702">follow, not just the commands</text></g><!--entity gen--><g class="entity" data-qualified-name="gen" data-source-line="5" id="ent0003"><rect fill="#FFFFFF" height="52" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="197.1475" x="7" y="209"/><rect fill="#FFFFFF" height="10" style="stroke:#000000;stroke-width:1;" width="15" x="184.1475" y="214"/><rect fill="#FFFFFF" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="182.1475" y="216"/><rect fill="#FFFFFF" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="182.1475" y="220"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="157.1475" x="22" y="237.4702">shell/tools/gen_runtime_docs.py</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="150.0898" x="22" y="248.4702">reads skills + argparse parsers</text></g><!--entity agents--><g class="entity" data-qualified-name="agents" data-source-line="6" id="ent0004"><rect fill="#FFFFFF" height="74" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="226.1675" x="316.49" y="333"/><rect fill="#FFFFFF" height="10" style="stroke:#000000;stroke-width:1;" width="15" x="522.6575" y="338"/><rect fill="#FFFFFF" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="520.6575" y="340"/><rect fill="#FFFFFF" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="520.6575" y="344"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="130.8237" x="331.49" y="361.4702">AGENTS.md (4,366 bytes)</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="186.1675" x="331.49" y="372.4702">rules + command inventory for Codex,</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="110.0376" x="331.49" y="383.4702">which loads skills itself</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="88.0269" x="331.49" y="394.4702">from .agents/skills</text></g><!--entity gemini--><g class="entity" data-qualified-name="gemini" data-source-line="7" id="ent0005"><rect fill="#FFFFFF" height="74" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="165.9307" x="87.61" y="333"/><rect fill="#FFFFFF" height="10" style="stroke:#000000;stroke-width:1;" width="15" x="233.5407" y="338"/><rect fill="#FFFFFF" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="231.5407" y="340"/><rect fill="#FFFFFF" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="231.5407" y="344"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="57.4492" x="102.61" y="361.4702">GEMINI.md</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="125.9307" x="102.61" y="372.4702">the same plus all six skills</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="116.7676" x="102.61" y="383.4702">compiled in: Gemini CLI</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="73.9868" x="102.61" y="394.4702">discovers none</text></g><!--entity claude--><g class="entity" data-qualified-name="claude" data-source-line="8" id="ent0006"><rect fill="#FFFFFF" height="63" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="206.0098" x="591.57" y="338.5"/><rect fill="#FFFFFF" height="10" style="stroke:#000000;stroke-width:1;" width="15" x="777.5798" y="343.5"/><rect fill="#FFFFFF" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="775.5798" y="345.5"/><rect fill="#FFFFFF" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="775.5798" y="349.5"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="64.2114" x="606.57" y="366.9702">Claude Code</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="116.7729" x="606.57" y="377.9702">reads SKILL.md directly</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="166.0098" x="606.57" y="388.9702">(plugin adds commands + agents)</text></g><!--entity mcpserver--><g class="entity" data-qualified-name="mcpserver" data-source-line="9" id="ent0007"><rect fill="#FFFFFF" height="74" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="176.3613" x="455.39" y="198"/><rect fill="#FFFFFF" height="10" style="stroke:#000000;stroke-width:1;" width="15" x="611.7513" y="203"/><rect fill="#FFFFFF" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="609.7513" y="205"/><rect fill="#FFFFFF" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="609.7513" y="209"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="77.6499" x="470.39" y="226.4702">optiondesk-mcp</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="113.1206" x="470.39" y="237.4702">10 typed tool schemas:</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="136.3613" x="470.39" y="248.4702">better than prose describing</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="77.6499" x="470.39" y="259.4702">a command line</text></g><g class="entity" data-qualified-name="GMN16" data-source-line="21" id="ent0017"><path d="M239.04,200 L239.04,231 L204.45,235 L239.04,239 L239.04,270 A0,0 0 0 0 239.04,270 L420.1035,270 A0,0 0 0 0 420.1035,270 L420.1035,210 L410.1035,200 L239.04,200 A0,0 0 0 0 239.04,200" fill="#17A2B8" style="stroke:#117A8B;stroke-width:0.5;"/><path d="M410.1035,200 L410.1035,210 L420.1035,210 L410.1035,200" fill="#17A2B8" style="stroke:#117A8B;stroke-width:0.5;"/><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="92.2607" x="245.04" y="212.7002">Two tests guard this:</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="153.9648" x="245.04" y="222.7002">- generated text vs what is on disk:</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="151.1719" x="250.5966" y="232.7002">a stale AGENTS.md fails the suite</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="160.0635" x="245.04" y="242.7002">- every argparse subcommand must</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="153.4277" x="250.5966" y="252.7002">appear in both copies: a command</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="151.2109" x="250.5966" y="262.7002">added without documentation fails</text></g><g class="entity" data-qualified-name="GMN19" data-source-line="30" id="ent0020"><path d="M334.32,468 L334.32,518 A0,0 0 0 0 334.32,518 L524.8366,518 A0,0 0 0 0 524.8366,518 L524.8366,478 L514.8366,468 L433.57,468 L429.57,407.3 L425.57,468 L334.32,468 A0,0 0 0 0 334.32,468" fill="#17A2B8" style="stroke:#117A8B;stroke-width:0.5;"/><path d="M514.8366,468 L514.8366,478 L524.8366,478 L514.8366,468" fill="#17A2B8" style="stroke:#117A8B;stroke-width:0.5;"/><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="158.9453" x="340.32" y="480.7002">Embedding all skills in AGENTS.md</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="159.0088" x="340.32" y="490.7002">took it to 25,851 bytes and defeated</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="169.5166" x="340.32" y="500.7002">progressive disclosure. Naming where</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="131.748" x="340.32" y="510.7002">they live instead: 4,366 bytes.</text></g><!--link skill to gen--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="11" id="lnk8"><path d="M450.69,112.66 C369.32,141.27 258.4003,180.2699 183.7403,206.5199" fill="none" id="skill-to-gen" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="178.08,208.51,187.8973,209.2983,182.7969,206.8516,185.2437,201.7512,178.08,208.51" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="39.4775" x="351.8" y="159.7002">generate</text></g><!--link gen to agents--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="12" id="lnk9"><path d="M167.66,261.49 C216.72,281.63 280.2894,307.7216 335.1994,330.2616" fill="none" id="gen-to-agents" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="340.75,332.54,333.9431,325.422,336.1245,330.6413,330.9052,332.8227,340.75,332.54" style="stroke:#000000;stroke-width:1;"/></g><!--link gen to gemini--><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="dependency" data-source-line="13" id="lnk10"><path d="M117.95,261.33 C127.82,281.53 139.1454,304.6894 150.2054,327.3194" fill="none" id="gen-to-gemini" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="152.84,332.71,152.4819,322.8677,150.6445,328.2178,145.2944,326.3804,152.84,332.71" style="stroke:#000000;stroke-width:1;"/></g><!--link skill to claude--><g class="link" data-entity-1="ent0002" data-entity-2="ent0006" data-link-type="dependency" data-source-line="14" id="lnk11"><path d="M621.45,116.38 C632.97,124.7 643.62,134.53 651.57,146 C692.36,204.8 697.0231,286.3209 696.2331,332.2809" fill="none" id="skill-to-claude" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="696.13,338.28,700.2841,329.3501,696.2159,333.2807,692.2853,329.2126,696.13,338.28" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="43.9063" x="694" y="237.7002">read as-is</text></g><!--link skill to mcpserver--><g class="link" data-entity-1="ent0002" data-entity-2="ent0007" data-link-type="dependency" data-source-line="15" id="lnk12"><path d="M543.57,116.5 C543.57,141.04 543.57,167.27 543.57,191.77" fill="none" id="skill-to-mcpserver" style="stroke:#000000;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#000000" points="543.57,197.77,547.57,188.77,543.57,192.77,539.57,188.77,543.57,197.77" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="79.4824" x="554.028" y="154.7002">same capabilities,</text><text fill="#000000" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="98.3984" x="544.57" y="164.7002">typed instead of prose</text></g><!--link mcpserver to claude--><g class="link" data-entity-1="ent0007" data-entity-2="ent0006" data-link-type="dependency" data-source-line="16" id="lnk13"><path d="M584.84,272.34 C608.24,292.96 632.7082,314.5034 654.9982,334.1434" fill="none" id="mcpserver-to-claude" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="659.5,338.11,655.3917,329.1589,655.7485,334.8045,650.1029,335.1613,659.5,338.11" style="stroke:#000000;stroke-width:1;"/></g><!--link mcpserver to agents--><g class="link" data-entity-1="ent0007" data-entity-2="ent0004" data-link-type="dependency" data-source-line="17" id="lnk14"><path d="M512.42,272.34 C496.34,291.11 480.6747,309.3845 464.5947,328.1445" fill="none" id="mcpserver-to-agents" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="460.69,332.7,469.5841,328.4699,463.944,328.9037,463.5101,323.2635,460.69,332.7" style="stroke:#000000;stroke-width:1;"/></g><!--link mcpserver to gemini--><g class="link" data-entity-1="ent0007" data-entity-2="ent0005" data-link-type="dependency" data-source-line="18" id="lnk15"><path d="M455.18,267.52 C394.21,289.26 319.3416,315.9552 259.5116,337.2852" fill="none" id="mcpserver-to-gemini