ll="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="83.1714" x="39.06" y="401.4702">and quality notes</text></g><g class="entity" data-qualified-name="Missing" id="ent0005"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="164.3105" x="197.46" y="377"/><line style="stroke:#181818;stroke-width:0.5;" x1="197.46" x2="361.7705" y1="409" y2="409"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="93.5483" x="207.46" y="390.4702">Report unmarkable</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="144.3105" x="207.46" y="401.4702">keep numeric P/L unavailable</text></g><g class="entity" data-qualified-name="Closed" id="ent0006"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="144.7275" x="569.25" y="255"/><line style="stroke:#181818;stroke-width:0.5;" x1="569.25" x2="713.9775" y1="287" y2="287"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="106.4014" x="579.25" y="268.4702">Closed paper position</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="124.7275" x="579.25" y="279.4702">settlement and close time</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="8" id="ent0002"><ellipse cx="317.62" cy="51" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN2" data-source-line="17" id="ent0003"><path d="M36.57,138 L36.57,178 A0,0 0 0 0 36.57,178 L222.6677,178 A0,0 0 0 0 222.6677,178 L222.6677,162 L257.67,158 L222.6677,154 L222.6677,148 L212.6677,138 L36.57,138 A0,0 0 0 0 36.57,138" fill="#E6F4F5" style="stroke:#117A8B;stroke-width:0.5;"/><path d="M212.6677,138 L212.6677,148 L222.6677,148 L212.6677,138" fill="#E6F4F5" style="stroke:#117A8B;stroke-width:0.5;"/><text fill="#17343D" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="150.6152" x="42.57" y="150.7002">Entry preserves legs, prices, spot,</text><text fill="#17343D" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="165.0977" x="42.57" y="160.7002">time, source plan and optional thesis.</text><text fill="#17343D" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="106.1768" x="42.57" y="170.7002">Status reads the ledger.</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="22" id="ent0006"><path d="M230.58,260 L230.58,276 L196.09,280 L230.58,284 L230.58,300 A0,0 0 0 0 230.58,300 L416.6484,300 A0,0 0 0 0 416.6484,300 L416.6484,270 L406.6484,260 L230.58,260 A0,0 0 0 0 230.58,260" fill="#E6F4F5" style="stroke:#117A8B;stroke-width:0.5;"/><path d="M406.6484,260 L406.6484,270 L416.6484,270 L406.6484,260" fill="#E6F4F5" style="stroke:#117A8B;stroke-width:0.5;"/><text fill="#17343D" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="140.625" x="236.58" y="272.7002">Newest matching chain on disk.</text><text fill="#17343D" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="165.0684" x="236.58" y="282.7002">Last-trade marks carry a quality note.</text><text fill="#17343D" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="122.8369" x="236.58" y="292.7002">A missing quote is not zero.</text></g><g class="entity" data-qualified-name="GMN8" data-source-line="27" id="ent0009"><path d="M492.98,382 L492.98,422 A0,0 0 0 0 492.98,422 L790.2495,422 A0,0 0 0 0 790.2495,422 L790.2495,392 L780.2495,382 L645.62,382 L641.62,305.28 L637.62,382 L492.98,382 A0,0 0 0 0 492.98,382" fill="#E6F4F5" style="stroke:#117A8B;stroke-width:0.5;"/><path d="M780.2495,382 L780.2495,392 L790.2495,392 L780.2495,382" fill="#E6F4F5" style="stroke:#117A8B;stroke-width:0.5;"/><text fill="#17343D" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="168.4033" x="498.98" y="394.7002">Close uses intrinsic-payoff settlement.</text><text fill="#17343D" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="241.7578" x="498.98" y="404.7002">It is not an early-close fill or a general two-expiry mark.</text><text fill="#17343D" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="276.2695" x="498.98" y="414.7002">Expiry and quote freshness are not enforced by the command.</text></g><!--link *start* to Open--><g class="link" data-entity-1="ent0002" data-entity-2="ent0002" data-link-type="dependency" data-source-line="8" id="lnk3"><path d="M317.62,61.32 C317.62,77.18 317.62,103.91 317.62,126.64" fill="none" id="*start*-to-Open" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="317.62,132.64,321.62,123.64,317.62,127.64,313.62,123.64,317.62,132.64" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="104.5117" x="318.62" y="99.7002">open from a saved plan</text></g><!--link Open to Mark--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="9" id="lnk4"><path d="M283.22,183.28 C253.82,204.03 216.632,230.2902 187.162,251.0902" fill="none" id="Open-to-Mark" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="182.26,254.55,191.9195,252.6282,186.345,251.6668,187.3064,246.0922,182.26,254.55" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="22.2217" x="238.72" y="221.7002">mark</text></g><!--link Mark to Marked--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="10" id="lnk5"><path d="M137.09,305.28 C128.07,326.1 117.5239,350.4339 108.5139,371.2439" fill="none" id="Mark-to-Marked" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="10