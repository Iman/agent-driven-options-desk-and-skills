<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="549px" preserveAspectRatio="none" style="width:1294px;height:549px;background:#FFFFFF;" version="1.1" viewBox="0 0 1294 549" width="1294px" zoomAndPan="magnify"><?plantuml 1.2026.3?><defs/><g><g class="title" data-source-line="2"><rect fill="none" height="24" style="stroke:#000000;stroke-width:1;" width="474.3857" x="406.492" y="5"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="464.3857" x="411.492" y="20.7803">Option Desk - Watch and completion loops are command instructions</text></g><!--entity host--><g class="entity" data-qualified-name="host" data-source-line="4" id="ent0002"><rect fill="#FFFFFF" height="42" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="164.896" x="483.46" y="42"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="144.896" x="493.46" y="60.4702">Host runtime / local scheduler</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="139.4014" x="493.46" y="71.4702">starts a requested command</text></g><!--entity watch--><g class="entity" data-qualified-name="watch" data-source-line="5" id="ent0003"><rect fill="#FFFFFF" height="42" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="157.5859" x="288.11" y="145"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="55.6338" x="298.11" y="163.4702">desk-watch</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="137.5859" x="298.11" y="174.4702">read baseline before refresh</text></g><!--entity refresh--><g class="entity" data-qualified-name="refresh" data-source-line="6" id="ent0004"><rect fill="#FFFFFF" height="42" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="199.1528" x="14.33" y="264.5"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="179.1528" x="24.33" y="282.9702">Refresh chain, Greeks and exposure</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="165.0752" x="24.33" y="293.9702">compare same underlying / expiry</text></g><!--entity change--><g class="entity" data-qualified-name="change" data-source-line="7" id="ent0005"><rect fill="#FFFFFF" height="42" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="213.8105" x="7" y="373"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="182.8428" x="17" y="391.4702">Material change or unavailable input?</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="193.8105" x="17" y="402.4702">spot, IV, regime, walls, RR, degradation</text></g><!--entity report--><g class="entity" data-qualified-name="report" data-source-line="8" id="ent0006"><rect fill="#FFFFFF" height="42" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="180.1929" x="23.81" y="476"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="160.1929" x="33.81" y="494.4702">Report changes with prior values</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="133.2998" x="33.81" y="505.4702">or no material change; stop</text></g><!--entity complete--><g class="entity" data-qualified-name="complete" data-source-line="9" id="ent0007"><rect fill="#FFFFFF" height="42" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="161.2007" x="686.3" y="145"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="71.5322" x="696.3" y="163.4702">desk-complete</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="141.2007" x="696.3" y="174.4702">read six criteria from artifacts</text></g><!--entity work--><g class="entity" data-qualified-name="work" data-source-line="10" id="ent0008"><rect fill="#FFFFFF" height="42" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="222.3828" x="519.71" y="264.5"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="157.1313" x="529.71" y="282.9702">Run only missing / failing stages</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="202.3828" x="529.71" y="293.9702">choose expiry, widen band or raise draws</text></g><!--entity stop--><g class="entity" data-qualified-name="stop" data-source-line="11" id="ent0009"><rect fill="#FFFFFF" height="53" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="178.3237" x="776.74" y="259"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="22.6284" x="786.74" y="277.4702">Stop</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="158.3237" x="786.74" y="288.4702">all criteria met, structural blocker</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="126.5537" x="786.74" y="299.4702">or configured attempt limit</text></g><g class="entity" data-qualified-name="GMN18" data-source-line="21" id="ent0019"><path d="M248.85,265.5 L248.85,305.5 A0,0 0 0 0 248.85,305.5 L484.9672,305.5 A0,0 0 0 0 484.9672,305.5 L484.9672,275.5 L474.9672,265.5 L370.91,265.5 L366.91,187.47 L362.91,265.5 L248.85,265.5 A0,0 0 0 0 248.85,265.5" fill="#E6F4F5" style="stroke:#117A8B;stroke-width:0.5;"/><path d="M474.9672,265.5 L474.9672,275.5 L484.9672,275.5 L474.9672,265.5" fill="#E6F4F5" style="stroke:#117A8B;stroke-width:0.5;"/><text fill="#17343D" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="215.1172" x="254.85" y="278.2002">Observation only. This command does not open,</text><text fill="#17343D" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="167.8564" x="254.85" y="288.2002">mark or close a paper or real position.</text><text fill="#17343D" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="199.5605" x="254.85" y="298.2002">Unavailable values are not numeric changes.</text></g><g class="entity" data-qualified-name="GMN21" data-source-line="26" id="ent0022"><path d="M990.44,260.5 L990.44,310.5 A0,0 0 0 0 990.44,310.5 L1279.3697,310.5 A0,0 0 0 0 1279.3697,310.5 L1279.3697,270.5 L1269.3697,260.5 L1062.49,260.5 L831.01,187.47 L1054.49,260.5 L990.44,260.5 A0,0 0 0 0 990.44,260.5" fill="#E6F4F5" style="stroke:#117A8B;stroke-width:0.5;"/><path d="M1269.3697,260.5 L1269.3697,270.5 L1279.3697,270.5 L1269.3697,260.5" fill="#E6F4F5" style="stroke:#117A8B;stroke-width:0.5;"/><text fill="#17343D" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="216.1865" x="996.44" y="273.2002">Six criteria: IV coverage, ladder size, walls/smile,</text><text fill="#17343D" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="252.3877" x="996.44" y="283.2002">rankable plans, converged horizon, degradation reasons.</text><text fill="#17343D" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="267.9297" x="996.44" y="293.2002">These are prompt instructions, not the LangGraph evaluator.</text><text fill="#17343D" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="212.876" x="996.44" y="303.2002">The host supplies recurrence and attempt limits.</text></g><!--link host to watch--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="12" id="lnk10"><path d="M525.63,84.44 C491.11,101.96 446.9703,124.3645 412.4703,141.8745" fill="none" id="host-to-watch" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="407.12,144.59,416.9558,144.0837,411.5786,142.3271,413.3352,136.9499,407.12,144.59" style="stroke:#000000;stroke-width:1;"/></g><!--link watch to refresh--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="13" id="lnk11"><path d="M322.84,187.47 C276.54,208.97 209.6017,240.0526 163.3317,261.5426" fill="none" id="watch-to-refresh" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="157.89,264.07,167.7375,263.9067,162.4248,261.9638,164.3676,256.6511,157.89,264.07" style="stroke:#000000;stroke-width:1;"/></g><!--link refresh to change--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="14" id="lnk12"><path d="M113.91,306.53 C113.91,325.45 113.91,347.69 113.91,366.7" fill="none" id="refresh-to-change" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="113.91,372.7,117.91,363.7,113.91,367.7,109.91,363.7,113.91,372.7" style="stroke:#000000;stroke-width:1;"/></g><!--link change to report--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-link-type="dependency" data-source-line="15" id="lnk13"><path d="M113.91,415.44 C113.91,432.96 113.91,452.08 113.91,469.59" fill="none" id="change-to-report" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="113.91,475.59,117.91,466.59,113.91,470.59,109.91,466.59,113.91,475.59" style="stroke:#000000;stroke-width:1;"/></g><!--link host to complete--><g class="link" data-entity-1="ent0002" data-entity-2="ent0007" data-link-type="dependency" data-source-line="16" id="lnk14"><path d="M606.58,84.44 C641.45,101.96 686.0787,124.3863 720.9287,141.8963" fill="none" id="host-to-complete" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="726.29,144.59,720.0438,136.9752,721.8222,142.3452,716.4522,144.1236,726.29,144.59" style="stroke:#000000;stroke-width:1;"/></g><!--link complete to work--><g class="link" data-entity-1="ent0007" data-entity-2="ent0008" data-link-type="dependency" data-source-line="17" id="lnk15"><path d="M685.93,178.39 C663.48,185.68 641.55,197.59 627.91,217 C618.39,230.53 618.8186,243.8082 622.4186,258.2482" fill="none" id="complete-to-work" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="623.87,264.07,625.5741,254.3697,622.6605,259.2185,617.8117,256.3049,623.87,264.07" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="94.5068" x="628.91" y="225.7002">unmet and repairable</text></g><!--link work to complete--><g class="link" data-entity-1="ent0008" data-entity-2="ent0007" data-link-type="dependency" data-source-line="18" id="lnk16"><path d="M676.99,264.07 C694.24,254.97 713.2,243.1 727.91,229 C740.3,217.12 747.668,205.8408 754.518,192.8108" fill="none" id="work-to-complete" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="757.31,187.5,749.5815,193.6049,754.9834,191.9257,756.6626,197.3276,757.31,187.5" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="38.3447" x="739.54" y="225.7002">re-check</text></g><!--link complete to stop--><g class="link" data-entity-1="ent0007" data-entity-2="ent0009" data-link-type="dependency" data-source-line="19" id="lnk17"><path d="M787.55,187.41 C796.25,196.28 806.32,206.93 814.91,217 C826.25,230.3 834.5085,240.984 843.9085,253.784" fill="none" id="complete-to-stop" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="847.46,258.62,845.3568,248.9983,844.5005,254.59,838.9088,253.7336,847.46,258.62" style="stroke:#000000;stroke-width:1;"/></g><g class="caption" data-source-line="32"><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="768.8379" x="259.2659" y="537.7803">Sources: .claude/commands/desk-watch.md and desk-complete.md. Commands depend on the host runtime for scheduling.</text></g></g></svg>