ly="Helvetica" font-size="11" lengthAdjust="spacing" textLength="71.5322" x="238.3563" y="446.4702">Prompt builder</text></g><g class="participant participant-head" data-entity-uid="part3" data-qualified-name="store" data-source-line="6" id="part3-head"><rect fill="#FFFFFF" height="25" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:0.5;" width="74.5215" x="392.2826" y="85"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="60.5215" x="399.2826" y="100.4702">ArtifactStore</text></g><g class="participant participant-tail" data-entity-uid="part3" data-qualified-name="store" data-source-line="6" id="part3-tail"><rect fill="#FFFFFF" height="25" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:0.5;" width="74.5215" x="392.2826" y="431"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="60.5215" x="399.2826" y="446.4702">ArtifactStore</text></g><g class="participant participant-head" data-entity-uid="part4" data-qualified-name="model" data-source-line="7" id="part4-head"><rect fill="#FFFFFF" height="25" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:0.5;" width="136.2676" x="476.8041" y="85"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="122.2676" x="483.8041" y="100.4702">Optional summary model</text></g><g class="participant participant-tail" data-entity-uid="part4" data-qualified-name="model" data-source-line="7" id="part4-tail"><rect fill="#FFFFFF" height="25" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:0.5;" width="136.2676" x="476.8041" y="431"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="122.2676" x="483.8041" y="446.4702">Optional summary model</text></g><g class="message" data-entity-1="part1" data-entity-2="part3" data-source-line="8" id="msg1"><polygon fill="#000000" points="417.5433,133,427.5433,137,417.5433,141,421.5433,137" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;" x1="96.1381" x2="423.5433" y1="137" y2="137"/><text fill="#000000" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="102.2754" x="103.1381" y="132.7002">context_for(underlying)</text></g><g class="message" data-entity-1="part3" data-entity-2="part1" data-source-line="9" id="msg2"><polygon fill="#000000" points="107.1381,157,97.1381,161,107.1381,165,103.1381,161" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2,2;" x1="101.1381" x2="428.5433" y1="161" y2="161"/><text fill="#000000" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="94.4922" x="113.1381" y="156.7002">saved artifact context</text></g><g class="message" data-entity-1="part1" data-entity-2="part2" data-source-line="10" id="msg3"><polygon fill="#000000" points="262.1224,181,272.1224,185,262.1224,189,266.1224,185" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;" x1="96.1381" x2="268.1224" y1="185" y2="185"/><text fill="#000000" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="151.7383" x="103.1381" y="180.7002">build_answer_prompt(extra_rules)</text></g><g class="message" data-entity-1="part2" data-entity-2="part2" data-source-line="11" id="msg4"><line style="stroke:#000000;stroke-width:1;" x1="274.1224" x2="316.1224" y1="219" y2="219"/><line style="stroke:#000000;stroke-width:1;" x1="316.1224" x2="316.1224" y1="219" y2="232"/><line style="stroke:#000000;stroke-width:1;" x1="275.1224" x2="316.1224" y1="232" y2="232"/><polygon fill="#000000" points="285.1224,228,275.1224,232,285.1224,236,281.1224,232" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="141.4209" x="281.1224" y="204.7002">system = REPORTING_RULES</text><text fill="#000000" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="122.5781" x="281.1224" y="214.7002">+ optional deployment rules</text></g><g class="message" data-entity-1="part2" data-entity-2="part1" data-source-line="12" id="msg5"><polygon fill="#000000" points="107.1381,252,97.1381,256,107.1381,260,103.1381,256" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2,2;" x1="101.1381" x2="273.1224" y1="256" y2="256"/><text fill="#000000" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="153.9844" x="113.1381" y="251.7002">template with context and question</text></g><g class="message" data-entity-1="part1" data-entity-2="part4" data-source-line="13" id="msg6"><polygon fill="#000000" points="532.9379,276,542.9379,280,532.9379,284,536.9379,280" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;" x1="96.1381" x2="538.9379" y1="280" y2="280"/><text fill="#000000" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="167.0166" x="103.1381" y="275.7002">formatted system + human messages</text></g><g class="message" data-entity-1="part4" data-entity-2="part1" data-source-line="14" id="msg7"><polygon fill="#000000" points="107.1381,300,97.1381,304,107.1381,308,103.1381,304" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2,2;" x1="101.1381" x2="543.9379" y1="304" y2="304"/><text fill="#000000" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="60.0098" x="113.1381" y="299.7002">summary text</text></g><path d="M220.7731,317 L220.7731,357 L596.7731,357 L596.7731,327 L586.7731,317 L220.7731,317" fill="#E6F4F5" style="stroke:#117A8B;stroke-width:0.5;"/><path d="M586.7731,317 L586.7731,327 L596.7731,327 L586.7731,317" fill="#E6F4F5" style="stroke:#117A8B;stroke-width:0.5;"/><text fill="#17343D" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="257.9102" x="257.3334" y="329.7002">Rules require artifact-grounded answers, degradation first,</text><text fill="#17343D" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="255.6592" x="257.3334" y="339.7002">correct units, visible missing values and model limitations.</text><text fill="#17343D" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="294.5947" x="257.3334" y="349.7002">These are prompt instructions, not a proof that every model obeys.</text><path d="M39.7731,367 L39.7731,417 L330.7731,417 L330.7731,377 L320.7731,367 L39.7731,367" fill="#E6F4F5" style="stroke:#117A8B;stroke-width:0.5;"/><path d="M320.7731,367 L320.7731,377 L330.7731,377 L320.7731,367" fill="#E6F4F5" style="stroke:#117A8B;stroke-width:0.5;"/><text fill="#17343D" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="189.5459" x="45.7731" y="379.7002">build_router_prompt() is a separate helper:</text><text fill="#17343D" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="213.1934" x="45.7731" y="389.7002">question -&gt; proposed tool name and arguments.</text><text fill="#17343D" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="257.9443" x="45.7731" y="399.7002">The bounded graph does not call that router or let a model</text><text fill="#17343D" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="270.6836" x="45.7731" y="409.7002">choose its calculation stages. Its optional model summarizes.</text><g class="caption" data-source-line="27"><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="649.8447" x="1" y="514.7803">Sources: agent/src/optiondesk_agent/prompts.py and graph.py. A prompt helper does not execute a tool.</text></g></g></svg>