<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="684px" preserveAspectRatio="none" style="width:723px;height:684px;background:#FFFFFF;" version="1.1" viewBox="0 0 723 684" width="723px" zoomAndPan="magnify"><?plantuml 1.2026.3?><defs/><g><g class="title" data-source-line="2"><rect fill="none" height="24" style="stroke:#000000;stroke-width:1;" width="436.3232" x="140.0229" y="5"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="426.3232" x="145.0229" y="20.7803">Option desk - Provider resolution by capability, never by vendor</text></g><!--entity need--><g class="entity" data-qualified-name="need" data-source-line="4" id="ent0002"><rect fill="#FFFFFF" height="74" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="211.4077" x="220.8906" y="42"/><rect fill="#FFFFFF" height="10" style="stroke:#000000;stroke-width:1;" width="15" x="412.2983" y="47"/><rect fill="#FFFFFF" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="410.2983" y="49"/><rect fill="#FFFFFF" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="410.2983" y="53"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="152.8613" x="235.8906" y="70.4702">A command needs a capability:</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="161.6699" x="235.8906" y="81.4702">option_chain | underlying_quote |</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="171.4077" x="235.8906" y="92.4702">risk_free_rate | underlying_history |</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="69.7168" x="235.8906" y="103.4702">dividend_yield</text></g><!--entity reg--><g class="entity" data-qualified-name="reg" data-source-line="5" id="ent0003"><rect fill="#C6E9C6" height="85" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="202.0137" x="225.5906" y="177"/><rect fill="#C6E9C6" height="10" style="stroke:#000000;stroke-width:1;" width="15" x="407.6043" y="182"/><rect fill="#C6E9C6" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="405.6043" y="184"/><rect fill="#C6E9C6" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="405.6043" y="188"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="40.3423" x="240.5906" y="205.4702">Registry</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="64.7969" x="240.5906" y="216.4702">priority order,</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="162.0137" x="240.5906" y="227.4702">keyless providers always eligible,</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="118.6206" x="240.5906" y="238.4702">keyed providers skipped</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="111.9014" x="240.5906" y="249.4702">when the key is absent</text></g><!--entity paid--><g class="entity" data-qualified-name="paid" data-source-line="6" id="ent0004"><rect fill="#FFFFFF" height="74" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="165.0444" x="72.0706" y="334"/><rect fill="#FFFFFF" height="10" style="stroke:#000000;stroke-width:1;" width="15" x="217.1151" y="339"/><rect fill="#FFFFFF" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="215.1151" y="341"/><rect fill="#FFFFFF" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="215.1151" y="345"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="72.1714" x="87.0706" y="362.4702">Alpha Vantage</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="60.5322" x="87.0706" y="373.4702">key required</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="89.8906" x="87.0706" y="384.4702">history and quotes</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="125.0444" x="87.0706" y="395.4702">~25 requests/day free tier</text></g><!--entity yahoo--><g class="entity" data-qualified-name="yahoo" data-source-line="7" id="ent0005"><rect fill="#FFFFFF" height="63" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="108.4814" x="272.3606" y="339.5"/><rect fill="#FFFFFF" height="10" style="stroke:#000000;stroke-width:1;" width="15" x="360.8421" y="344.5"/><rect fill="#FFFFFF" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="358.8421" y="346.5"/><rect fill="#FFFFFF" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="358.8421" y="350.5"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="31.8076" x="287.3606" y="367.9702">Yahoo</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="66.6553" x="287.3606" y="378.9702">free, delayed,</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="68.4814" x="287.3606" y="389.9702">all capabilities</text></g><!--entity err--><g class="entity" data-qualified-name="err" data-source-line="8" id="ent0006"><rect fill="#FFFFFF" height="63" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="171.4683" x="415.8606" y="339.5"/><rect fill="#FFFFFF" height="10" style="stroke:#000000;stroke-width:1;" width="15" x="567.3289" y="344.5"/><rect fill="#FFFFFF" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="565.3289" y="346.5"/><rect fill="#FFFFFF" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="565.3289" y="350.5"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="98.4414" x="430.8606" y="367.9702">ProviderUnavailable</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="113.7329" x="430.8606" y="378.9702">names every candidate</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="131.4683" x="430.8606" y="389.9702">and why each was skipped</text></g><!--entity art--><g class="entity" data-qualified-name="art" data-source-line="9" id="ent0007"><rect fill="#FFFFFF" height="52" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="186.7329" x="61.2306" y="469"/><rect fill="#FFFFFF" height="10" style="stroke:#000000;stroke-width:1;" width="15" x="227.9635" y="474"/><rect fill="#FFFFFF" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="225.9635" y="476"/><rect fill="#FFFFFF" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="225.9635" y="480"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="146.7329" x="76.2306" y="497.4702">Artifact records provider_used</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="83.1553" x="76.2306" y="508.4702">in the meta block</text></g><g class="entity" data-qualified-name="GMN14" data-source-line="19" id="ent0015"><path d="M463.0506,189.5 L463.0506,215.5 L428.1006,219.5 L463.0506,223.5 L463.0506,249.5 A0,0 0 0 0 463.0506,249.5 L654.1385,249.5 A0,0 0 0 0 654.1385,249.5 L654.1385,199.5 L644.1385,189.5 L463.0506,189.5 A0,0 0 0 0 463.0506,189.5" fill="#17A2B8" style="stroke:#117A8B;stroke-width:0.5;"/><path d="M644.1385,189.5 L644.1385,199.5 L654.1385,199.5 L644.1385,189.5" fill="#17A2B8" style="stroke:#117A8B;stroke-width:0.5;"/><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="137.2656" x="469.0506" y="202.2002">--provider is strict: if the named</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="170.0879" x="469.0506" y="212.2002">provider cannot answer, the command</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="143.9648" x="469.0506" y="222.2002">fails rather than quietly serving a</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="160.9082" x="469.0506" y="232.2002">different source. strict=False in code</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="83.9307" x="469.0506" y="242.2002">allows the fallback.</text></g><g class="entity" data-qualified-name="GMN17" data-source-line="27" id="ent0018"><path d="M70.4406,582 L70.4406,652 A0,0 0 0 0 70.4406,652 L238.7502,652 A0,0 0 0 0 238.7502,652 L238.7502,592 L228.7502,582 L158.6006,582 L154.6006,521.45 L150.6006,582 L70.4406,582 A0,0 0 0 0 70.4406,582" fill="#17A2B8" style="stroke:#117A8B;stroke-width:0.5;"/><path d="M228.7502,582 L228.7502,592 L238.7502,592 L228.7502,582" fill="#17A2B8" style="stroke:#117A8B;stroke-width:0.5;"/><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="142.2852" x="76.4406" y="594.7002">Keys resolve from CLI flag, then</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="132.3047" x="76.4406" y="604.7002">environment, then ./.env, then</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="147.3096" x="76.4406" y="614.7002">/.optiondesk/config.env. They are</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="134.502" x="76.4406" y="624.7002">read, never written to artifacts,</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="126.1865" x="76.4406" y="634.7002">never logged, prompted with</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="57.2705" x="76.4406" y="644.7002">hidden input.</text></g><g class="entity" data-qualified-name="GMN20" data-source-line="36" id="ent0021"><path d="M282.5006,475 L282.5006,515 A0,0 0 0 0 282.5006,515 L454.6871,515 A0,0 0 0 0 454.6871,515 L454.6871,485 L444.6871,475 L365.9406,475 L337.1906,402.79 L357.9406,475 L282.5006,475 A0,0 0 0 0 282.5006,475" fill="#17A2B8" style="stroke:#117A8B;stroke-width:0.5;"/><path d="M444.6871,475 L444.6871,485 L454.6871,485 L444.6871,475" fill="#17A2B8" style="stroke:#117A8B;stroke-width:0.5;"/><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="143.96" x="288.5006" y="487.7002">A licence on this software grants</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="151.1865" x="288.5006" y="497.7002">no rights over the data it retrieves:</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="150.8691" x="288.5006" y="507.7002">each provider's terms govern that.</text></g><!--link need to reg--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="11" id="lnk8"><path d="M326.6006,116.39 C326.6006,134.9 326.6006,151.5 326.6006,170.72" fill="none" id="need-to-reg" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="326.6006,176.72,330.6006,167.72,326.6006,171.72,322.6006,167.72,326.6006,176.72" style="stroke:#000000;stroke-width:1;"/></g><!--link reg to paid--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="12" id="lnk9"><path d="M278.6806,262.14 C252.8406,284.61 225.7799,308.1349 200.9299,329.7249" fill="none" id="reg-to-paid" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="196.4006,333.66,205.818,330.7768,200.1751,330.3807,200.5712,324.7378,196.4006,333.66" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="51.6943" x="241.6006" y="300.7002">key present</text></g><!--link reg to yahoo--><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="dependency" data-source-line="13" id="lnk10"><path d="M326.6006,262.14 C326.6006,286.51 326.6006,310.75 326.6006,333.01" fill="none" id="reg-to-yahoo" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="326.6006,339.01,330.6006,330.01,326.6006,334.01,322.6006,330.01,326.6006,339.01" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="72.8174" x="327.6006" y="300.7002">always available</text></g><!--link reg to err--><g class="link" data-entity-1="ent0003" data-entity-2="ent0006" data-link-type="dependency" data-source-line="14" id="lnk11"><path d="M375.3406,262.14 C403.8606,286.51 434.7092,312.8522 460.7592,335.1122" fill="none" id="reg-to-err" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="465.3206,339.01,461.077,330.1223,461.5194,335.7618,455.8799,336.2042,465.3206,339.01" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="86.7236" x="420.3406" y="300.7002">nothing can answer</text></g><!--link paid to art--><g class="link" data-entity-1="ent0004" data-entity-2="ent0007" data-link-type="dependency" data-source-line="15" id="lnk12"><path d="M154.6006,408.27 C154.6006,427.66 154.6006,445.06 154.6006,462.51" fill="none" id="paid-to-art" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="154.6006,468.51,158.6006,459.51,154.6006,463.51,150.6006,459.51,154.6006,468.51" style="stroke:#000000;stroke-width:1;"/></g><!--link yahoo to art--><g class="link" data-entity-1="ent0005" data-entity-2="ent0007" data-link-type="dependency" data-source-line="16" id="lnk13"><path d="M283.1906,402.79 C254.5306,423.12 222.3249,445.9