[project]
name = "optiondesk"
version = "0.1.0"
description = "Option desk shell: data providers, contracts, artifacts, MCP server, dashboard"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Iman Samizadeh" }]
dependencies = []

[project.optional-dependencies]
yahoo = ["yfinance>=0.2"]
dashboard = ["fastapi>=0.110", "uvicorn>=0.27"]
engine = ["optiondesk-engine"]
# fastapi and uvicorn are here as well as in the dashboard extra so the
# suite actually exercises the richer server. Without them the test for
# its routes skips, and a skipped test reads like a pass.
dev = ["pytest", "yfinance>=0.2", "pyyaml", "fastapi>=0.110",
       "uvicorn>=0.27"]

[project.scripts]
optiondesk = "optiondesk.cli.__main__:main"
optiondesk-mcp = "optiondesk.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/optiondesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
