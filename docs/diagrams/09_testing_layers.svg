roke-width:1;" width="4" x="242.2728" y="284"/><rect fill="#C6E9C6" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="242.2728" y="288"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="88.0483" x="58.89" y="305.4702">Unit line coverage</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="159.5645" x="58.89" y="316.4702">80% minimum in EACH package</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="180.3828" x="58.89" y="327.4702">complete production file denominator</text></g><!--entity ci--><g class="entity" data-qualified-name="ci" data-source-line="10" id="ent0008"><rect fill="#FFFFFF" height="63" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="200.1768" x="715.99" y="400"/><rect fill="#FFFFFF" height="10" style="stroke:#000000;stroke-width:1;" width="15" x="896.1668" y="405"/><rect fill="#FFFFFF" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="894.1668" y="407"/><rect fill="#FFFFFF" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="894.1668" y="411"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="11" x="730.99" y="428.4702">CI</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="104.5859" x="730.99" y="439.4702">Python 3.11 and 3.13</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="160.1768" x="730.99" y="450.4702">reports, refresh, mutation checks</text></g><g class="entity" data-qualified-name="GMN18" data-source-line="21" id="ent0019"><path d="M6,411.5 L6,451.5 A0,0 0 0 0 6,451.5 L302.1563,451.5 A0,0 0 0 0 302.1563,451.5 L302.1563,421.5 L292.1563,411.5 L158.08,411.5 L154.08,340.35 L150.08,411.5 L6,411.5 A0,0 0 0 0 6,411.5" fill="#E6F4F5" style="stroke:#117A8B;stroke-width:0.5;"/><path d="M292.1563,411.5 L292.1563,421.5 L302.1563,421.5 L292.1563,411.5" fill="#E6F4F5" style="stroke:#117A8B;stroke-width:0.5;"/><text fill="#17343D" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="275.1563" x="12" y="424.2002">BDD and integration coverage do not enter this measurement.</text><text fill="#17343D" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="258.457" x="12" y="434.2002">Branch coverage is recorded without a separate minimum.</text><text fill="#17343D" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="250.1611" x="12" y="444.2002">A passing total cannot offset an under-covered package.</text></g><g class="entity" data-qualified-name="GMN21" data-source-line="26" id="ent0022"><path d="M299.17,288.5 L299.17,328.5 A0,0 0 0 0 299.17,328.5 L576.9766,328.5 A0,0 0 0 0 576.9766,328.5 L576.9766,298.5 L566.9766,288.5 L442.08,288.5 L438.08,217.35 L434.08,288.5 L299.17,288.5 A0,0 0 0 0 299.17,288.5" fill="#E6F4F5" style="stroke:#117A8B;stroke-width:0.5;"/><path d="M566.9766,288.5 L566.9766,298.5 L576.9766,298.5 L566.9766,288.5" fill="#E6F4F5" style="stroke:#117A8B;stroke-width:0.5;"/><text fill="#17343D" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="216.792" x="305.17" y="301.2002">TDD is a sequence: observe the intended failure,</text><text fill="#17343D" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="256.8066" x="305.17" y="311.2002">implement the behavior, then observe the same test pass.</text><text fill="#17343D" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="105.6006" x="305.17" y="321.2002">It is not a fifth test layer.</text></g><!--link code to unit--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="11" id="lnk9"><path d="M683.56,94.49 C636.09,111.9 578.5532,132.9944 528.1832,151.4644" fill="none" id="code-to-unit" style="stroke:#000000;stroke-width:1;"/><polygon fill="#0