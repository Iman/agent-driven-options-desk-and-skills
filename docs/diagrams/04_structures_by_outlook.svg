<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="301px" preserveAspectRatio="none" style="width:1535px;height:301px;background:#FFFFFF;" version="1.1" viewBox="0 0 1535 301" width="1535px" zoomAndPan="magnify"><?plantuml 1.2026.3?><defs/><g><g class="title" data-source-line="2"><rect fill="none" height="24" style="stroke:#000000;stroke-width:1;" width="541.3369" x="493.3326" y="5"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="531.3369" x="498.3326" y="20.7803">Option desk - Twenty-one structures, tagged by the directional view each needs</text></g><!--entity sb--><g class="entity" data-qualified-name="sb" data-source-line="4" id="ent0002"><rect fill="#FFFFFF" height="42" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="89.7061" x="21.7" y="69.5"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="9.7808" x="31.7" y="87.9702">-2</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="69.7061" x="31.7" y="98.9702">strong bearish</text></g><!--entity mb--><g class="entity" data-qualified-name="mb" data-source-line="5" id="ent0003"><rect fill="#FFFFFF" height="42" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="79.3022" x="161.9" y="69.5"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="9.7808" x="171.9" y="87.9702">-1</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="59.3022" x="171.9" y="98.9702">mild bearish</text></g><!--entity n--><g class="entity" data-qualified-name="n" data-source-line="6" id="ent0004"><rect fill="#C6E9C6" height="42" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="53.6338" x="489.73" y="69.5"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="6.1177" x="499.73" y="87.9702">0</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="33.6338" x="499.73" y="98.9702">neutral</text></g><!--entity mu--><g class="entity" data-qualified-name="mu" data-source-line="7" id="ent0005"><rect fill="#FFFFFF" height="42" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="74.4092" x="812.34" y="69.5"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="12.5415" x="822.34" y="87.9702">+1</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="54.4092" x="822.34" y="98.9702">mild bullish</text></g><!--entity su--><g class="entity" data-qualified-name="su" data-source-line="8" id="ent0006"><rect fill="#FFFFFF" height="42" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="84.813" x="944.14" y="69.5"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="12.5415" x="954.14" y="87.9702">+2</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="64.813" x="954.14" y="98.9702">strong bullish</text></g><!--entity lp--><g class="entity" data-qualified-name="lp" data-source-line="15" id="ent0011"><rect fill="#FFFFFF" height="42" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="89.0991" x="7" y="213"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="42.2061" x="17" y="231.4702">long_put</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="69.0991" x="17" y="242.4702">protective_put</text></g><!--entity bps--><g class="entity" data-qualified-name="bps" data-source-line="16" id="ent0012"><rect fill="#FFFFFF" height="42" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="141.6714" x="130.71" y="213"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="83.1768" x="140.71" y="231.4702">bear_put_spread</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="121.6714" x="140.71" y="242.4702">bear_call_spread (credit)</text></g><!--entity ic--><g class="entity" data-qualified-name="ic" data-source-line="17" id="ent0013"><rect fill="#FFFFFF" height="53" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="182.0459" x="307.53" y="207.5"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="127.7944" x="317.53" y="225.9702">iron_condor, iron_butterfly</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="88.666" x="317.53" y="236.9702">long_call_butterfly</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="162.0459" x="317.53" y="247.9702">cash_secured_put, covered_call*</text></g><!--entity bcs--><g class="entity" data-qualified-name="bcs" data-source-line="18" id="ent0014"><rect fill="#FFFFFF" height="53" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="135.5645" x="781.77" y="207.5"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="79.4976" x="791.77" y="225.9702">bull_call_spread</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="115.5645" x="791.77" y="236.9702">bull_put_spread (credit)</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="61.7568" x="791.77" y="247.9702">covered_call</text></g><!--entity lc--><g class="entity" data-qualified-name="lc" data-source-line="19" id="ent0015"><rect fill="#FFFFFF" height="42" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="112.9414" x="952.08" y="213"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="43.4199" x="962.08" y="231.4702">long_call</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="92.9414" x="962.08" y="242.4702">straddle, strangle**</text></g><!--entity asym--><g class="entity" data-qualified-name="asym" data-source-line="27" id="ent0021"><rect fill="#FFFFFF" height="97" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="212.2852" x="1064.41" y="42"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="110.6445" x="1074.41" y="60.4702">Asymmetric by design:</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="170.6021" x="1074.41" y="71.4702">ratio_spread (uncapped short side)</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="185.8721" x="1074.41" y="82.4702">broken_wing_butterfly (one-sided risk,</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="67.2568" x="1074.41" y="93.4702">often a credit)</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="180.3774" x="1074.41" y="104.4702">jade_lizard (no upside risk only when</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="192.2852" x="1074.41" y="115.4702">credit &gt; call-spread width, and it reports</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="133.9067" x="1074.41" y="126.4702">whether that actually holds)</text></g><!--entity timesp--><g class="entity" data-qualified-name="timesp" data-source-line="28" id="ent0022"><rect fill="#FFFFFF" height="75" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="208.9121" x="1312.09" y="53"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="188.9121" x="1322.09" y="71.4702">Two expiries, from a pair of snapshots:</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="172.4604" x="1322.09" y="82.4702">calendar_spread, diagonal_spread,</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="188.3643" x="1322.09" y="93.4702">ratio_call_diagonal, ratio_put_diagonal</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="181.5913" x="1322.09" y="104.4702">(delta-targeted legs: short delta mass</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="171.8052" x="1322.09" y="115.4702">strictly below long, or no plan at all)</text></g><g class="entity" data-qualified-name="GMN23" data-source-line="31" id="ent0024"><path d="M524.73,199 L524.73,269 A0,0 0 0 0 524.73,269 L746.3648,269 A0,0 0 0 0 746.3648,269 L746.3648,209 L736.3648,199 L610.58,199 L533.6,111.77 L602.58,199 L524.73,199 A0,0 0 0 0 524.73,199" fill="#17A2B8" style="stroke:#117A8B;stroke-width:0.5;"/><path d="M736.3648,199 L736.3648,209 L746.3648,209 L736.3648,199" fill="#17A2B8" style="stroke:#117A8B;stroke-width:0.5;"/><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="170.6494" x="530.73" y="211.7002">Three of the five outlooks sit inside the</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="192.3486" x="530.73" y="221.7002">one-standard-deviation expected move and</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="200.6348" x="530.73" y="231.7002">two are extreme: a spread reaches maximum</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="197.9004" x="530.73" y="241.7002">profit on a normal move, a naked long option</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="191.7578" x="530.73" y="251.7002">needs an extreme one. --recommend ranks</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="83.9453" x="530.73" y="261.7002">against these tags.</text></g><g class="entity" data-qualified-name="GMN26" data-source-line="40" id="ent0027"><path d="M1100.16,209 L1100.16,230 L1065.28,234 L1100.16,238 L1100.16,259 A0,0 0 0 0 1100.16,259 L1328.9373,259 A0,0 0 0 0 1328.9373,259 L1328.9373,219 L1318.9373,209 L1100.16,209 A0,0 0 0 0 1100.16,209" fill="#17A2B8" style="stroke:#117A8B;stroke-width:0.5;"/><path d="M1318.9373,209 L1318.9373,219 L1328.9373,219 L1318.9373,209" fill="#17A2B8" style="stroke:#117A8B;stroke-width:0.5;"/><rect fill="#FFFFFF" height="3.5" width="3.5" x="1115.16" y="214"/><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="191.7773" x="1122.16" y="221.7002">straddle and strangle are direction-agnostic</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="176.1963" x="1106.16" y="231.7002">volatility trades listed under the extreme</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="185.1172" x="1106.16" y="241.7002">buckets because they need a large move.</text><ellipse cx="1111.66" cy="246.5" fill="#FFFFFF" rx="2.5" ry="2.5"/><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="185.0977" x="1118.16" y="251.7002">covered_call spans neutral to mild bullish.</text></g><!--link sb to mb--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="association" data-source-line="10" id="lnk7"><path d="M111.9,90.5 C128.48,90.5 145.05,90.5 161.63,90.5" fill="none" id="sb-mb" style="stroke:#000000;stroke-width:1;"/></g><!--link mb to n--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="association" data-source-line="11" id="lnk8"><path d="M241.54,90.5 C324.17,90.5 406.8,90.5 489.42,90.5" fil