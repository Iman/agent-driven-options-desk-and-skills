# Running the three suites in one command used to fail.
#
# Two separate collisions, both caused by pytest's default prepend import
# mode putting every test directory on sys.path as a top level namespace.
# Eight shell modules imported a marker from `conftest`, and the agent
# package's conftest won that name. Then shell and agent each have a
# test_artifacts.py, and two modules cannot share a basename without
# packages.
#
# importlib mode leaves sys.path alone, which fixes both, and pythonpath
# puts back exactly the three directories the helper modules live in. A
# person running pytest at the repository root should not be told the
# project is broken when it is not.
[pytest]
addopts = --import-mode=importlib
pythonpath = engine/tests shell/tests agent/tests
testpaths = engine/tests shell/tests agent/tests
markers =
    unit: in-process tests with external process and network boundaries isolated
    bdd: Gherkin acceptance scenarios across the sample workflow
    integration: real processes, transports, and component workflows
    validation: repository, documentation, packaging, and test-infrastructure checks
