name: refresh

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The floor and a current release. The engine is standard library
        # only, so a version difference here is a real signal rather than a
        # dependency resolving differently.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the three packages
        run: |
          python -m pip install --upgrade pip
          # agent[dev] carries langgraph. Installing the agent bare makes
          # 49 graph tests fail on an import, which reads like a broken
          # graph rather than a missing extra.
          python -m pip install -e "shell[yahoo,dashboard,dev]" -e engine \
              -e "agent[graph,dev]"

      - name: Install Chromium for integration tests
        run: python -m playwright install --with-deps chromium

      - name: Unit tests and coverage
        run: |
          mkdir -p artifacts/coverage
          python -m coverage run -m pytest -m unit -q --color=no --junitxml=artifacts/coverage/unit-tests.xml
          python -m coverage json
          python -m coverage xml
          python -m coverage html
          python scripts/check_unit_coverage.py artifacts/coverage/unit.json

      - name: BDD scenarios
        run: python -m pytest -m bdd -q --color=no --junitxml=artifacts/coverage/bdd-tests.xml

      - name: Integration tests
        run: python -m pytest -m integration -q --color=no --junitxml=artifacts/coverage/integration-tests.xml

      - name: Repository validation
        run: python -m pytest -m validation -q --color=no --junitxml=artifacts/coverage/validation-tests.xml

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-python-${{ matrix.python-version }}
          path: artifacts/coverage/
          if-no-files-found: error

      - name: Refresh generated files
        # No network in CI, so the stages that would reach a provider skip
        # themselves the same way they do offline. Everything else runs.
        run: python scripts/refresh.py --fast --no-index

      - name: Mutation harness
        # Slower than the suite and worth its own step, because a survivor
        # is a hole in the tests rather than a broken build, and the
        # distinction should be visible in the log.
        run: python scripts/mutate.py
