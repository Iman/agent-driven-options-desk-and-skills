[project]
name = "optiondesk-engine"
version = "0.3.0"
description = "Option pricing and Greek analytics engine for the option desk"
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "Iman Samizadeh" }]
dependencies = []

[project.optional-dependencies]
quantlib = ["QuantLib==1.43"]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/optiondesk_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
