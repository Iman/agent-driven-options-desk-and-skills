<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="321px" preserveAspectRatio="none" style="width:820px;height:321px;background:#FFFFFF;" version="1.1" viewBox="0 0 820 321" width="820px" zoomAndPan="magnify"><?plantuml 1.2026.3?><defs/><g><g class="title" data-source-line="2"><rect fill="none" height="24" style="stroke:#000000;stroke-width:1;" width="648.709" x="82.5963" y="5"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="638.709" x="87.5963" y="20.7803">Option desk - Licensing (PolyForm Noncommercial 1.0.0, one licence over the whole repository)</text></g><!--entity free--><g class="entity" data-qualified-name="free" data-source-line="4" id="ent0002"><rect fill="#C6E9C6" height="85" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="208.1313" x="25.91" y="42"/><rect fill="#C6E9C6" height="10" style="stroke:#000000;stroke-width:1;" width="15" x="214.0413" y="47"/><rect fill="#C6E9C6" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="212.0413" y="49"/><rect fill="#C6E9C6" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="212.0413" y="53"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="97.2007" x="40.91" y="70.4702">Noncommercial use</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="159.5913" x="40.91" y="81.4702">personal study, research, hobby,</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="168.1313" x="40.91" y="92.4702">charities, schools, public research,</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="163.8721" x="40.91" y="103.4702">health, environment, government,</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="108.2329" x="40.91" y="114.4702">whatever their funding</text></g><!--entity work--><g class="entity" data-qualified-name="work" data-source-line="5" id="ent0003"><rect fill="#FFFFFF" height="63" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="168.4067" x="220.77" y="212.5"/><rect fill="#FFFFFF" height="10" style="stroke:#000000;stroke-width:1;" width="15" x="369.1767" y="217.5"/><rect fill="#FFFFFF" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="367.1767" y="219.5"/><rect fill="#FFFFFF" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="367.1767" y="223.5"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="58.7007" x="235.77" y="240.9702">Option desk</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="128.4067" x="235.77" y="251.9702">engine, shell, agent, skills,</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="111.896" x="235.77" y="262.9702">commands, dashboard</text></g><!--entity paid--><g class="entity" data-qualified-name="paid" data-source-line="6" id="ent0004"><rect fill="#FFFFFF" height="85" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="187.3506" x="452.3" y="42"/><rect fill="#FFFFFF" height="10" style="stroke:#000000;stroke-width:1;" width="15" x="619.6506" y="47"/><rect fill="#FFFFFF" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="617.6506" y="49"/><rect fill="#FFFFFF" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="617.6506" y="53"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="79.4653" x="467.3" y="70.4702">Commercial use</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="146.1528" x="467.3" y="81.4702">funds and trading businesses,</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="137.5645" x="467.3" y="92.4702">selling it or access to it, paid</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="147.3506" x="467.3" y="103.4702">consulting or signals, courses,</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="134.5298" x="467.3" y="114.4702">fundraising on the back of it</text></g><g class="entity" data-qualified-name="GMN7" data-source-line="12" id="ent0008"><path d="M6,229 L6,259 A0,0 0 0 0 6,259 L185.9551,259 A0,0 0 0 0 185.9551,259 L185.9551,239 L175.9551,229 L103.08,229 L120.96,127.29 L95.08,229 L6,229 A0,0 0 0 0 6,229" fill="#17A2B8" style="stroke:#117A8B;stroke-width:0.5;"/><path d="M175.9551,229 L175.9551,239 L185.9551,239 L175.9551,229" fill="#17A2B8" style="stroke:#117A8B;stroke-width:0.5;"/><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="136.7334" x="12" y="241.7002">Modify it, build on it, pass it on,</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="158.9551" x="12" y="251.7002">as long as these terms travel with it.</text></g><g class="entity" data-qualified-name="GMN10" data-source-line="17" id="ent0011"><path d="M652.05,224 L652.05,264 A0,0 0 0 0 652.05,264 L805.9016,264 A0,0 0 0 0 805.9016,264 L805.9016,234 L795.9016,224 L710.33,224 L594.54,127.29 L702.33,224 L652.05,224 A0,0 0 0 0 652.05,224" fill="#17A2B8" style="stroke:#117A8B;stroke-width:0.5;"/><path d="M795.9016,224 L795.9016,234 L805.9016,234 L795.9016,224" fill="#17A2B8" style="stroke:#117A8B;stroke-width:0.5;"/><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="132.8516" x="658.05" y="236.7002">Ask: terms are negotiable and</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="125.6396" x="658.05" y="246.7002">a share is one of the shapes</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="43.3594" x="658.05" y="256.7002">they take.</text></g><g class="entity" data-qualified-name="GMN13" data-source-line="23" id="ent0014"><path d="M424.47,199 L424.47,240 L389.35,244 L424.47,248 L424.47,289 A0,0 0 0 0 424.47,289 L617.4915,289 A0,0 0 0 0 617.4915,289 L617.4915,209 L607.4915,199 L424.47,199 A0,0 0 0 0 424.47,199" fill="#17A2B8" style="stroke:#117A8B;stroke-width:0.5;"/><path d="M607.4915,199 L607.4915,209 L617.4915,209 L607.4915,199" fill="#17A2B8" style="stroke:#117A8B;stroke-width:0.5;"/><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="150.083" x="430.47" y="211.7002">Deliberately not OSI open source,</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="162.3096" x="430.47" y="221.7002">and the trade is named: fewer users,</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="158.3936" x="430.47" y="231.7002">fewer contributors, some directories</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="137.8418" x="430.47" y="241.7002">treat noncommercial as unfree.</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="172.0215" x="430.47" y="251.7002">The previous MIT + AGPL pair allowed</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="159.5313" x="430.47" y="261.7002">the exact thing it was meant to stop.</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="167.8955" x="430.47" y="271.7002">Copies taken before 2026-08-31 keep</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="117.2754" x="430.47" y="281.7002">the terms they were given.</text></g><!--link free to work--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="8" id="lnk5"><path d="M176.41,127.29 C205.98,153.9 239.1802,183.7862 266.0802,207.9962" fill="none" id="free-to-work" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="270.54,212.01,266.5262,203.0161,266.8235,208.6652,261.1745,208.9625,270.54,212.01" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="98.3984" x="223.72" y="165.7002">no permission needed</text></g><!--link paid to work--><g class="link" data-entity-1="ent0004" data-entity-2="ent0003" data-link-type="dependency" data-source-line="9" id="lnk6"><path d="M482.03,127.29 C441.31,153.9 394.4727,184.5179 357.4227,208.7279" fill="none" id="paid-to-work" style="stroke:#000000;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#000000" points="352.4,212.01,362.1222,210.4354,356.5856,209.2749,357.7461,203.7384,352.4,212.01" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="98.9258" x="433.7" y="165.7002">written agreement first</text></g><g class="caption" data-source-line="33"><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="722.0596" x="45.921" y="309.7803">Full detail in LICENSES.md; provenance of every borrowed line in THIRD-PARTY.md; contribution terms in CLA.md.</text></g><?plantuml-src PLJHRjD047ptLopm0iAn0aWL50cfIbk8L4hLzWKfBsTx4wzolhNkpWdvUsQT2W9zYdtPdPcTsVCB2OqVMwRSSS-LZBqlicJFz6F8ee5QJbkQqOqq79A43Rs-Kt-urjZJhOP6-vvZ8yxJksfUpKlImEIjk67I7KS3fdsdG8myQ9AiyV2cAD0ve3PaUlalpfXu5GQEIGFUKXxRGudMn2usNKcTrlMXN8McSr6oS2efDPsgnyCmrg3-MxmA7JkVqSLX9r533xwIDgRh-BmA-yvbVj8faTPZQ37bItA9rf6PNYtEhZujpaxrdZYpmib60aD4nzwNv3OJHTgAXwBLD9WBBSIrBdMrkjXEs7kDsrFCnNy6c8v4wAGSdIcYUeJzd18RR0AP7KecZUIQ1dzGLhp31IUj4OSq-cn5g4YoWPjGqUWOZn3649rCcM8QYwbspPPq3PH9em4LnUJ2RFPbaapd59IGJYyfcGc1kUMsi5AggZz5UsIJES0ET9lJj9QOSb44pU3H