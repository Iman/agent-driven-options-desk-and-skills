racts, spot, listed expiries</text></g><g class="message" data-entity-1="part3" data-entity-2="part5" data-source-line="15" id="msg5"><polygon fill="#000000" points="785.6011,229,795.6011,233,785.6011,237,789.6011,233" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;" x1="499.3955" x2="791.6011" y1="233" y2="233"/><text fill="#000000" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="105.6055" x="506.3955" y="228.7002">implied_vol per contract</text></g><g class="message" data-entity-1="part5" data-entity-2="part3" data-source-line="16" id="msg6"><polygon fill="#000000" points="510.3955,253,500.3955,257,510.3955,261,506.3955,257" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2,2;" x1="504.3955" x2="796.6011" y1="257" y2="257"/><text fill="#000000" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="168.4521" x="516.3955" y="252.7002">595 solved, 12 refused as unidentified</text></g><path d="M802,270 L802,350 L1014,350 L1014,280 L1004,270 L802,270" fill="#17A2B8" style="stroke:#117A8B;stroke-width:0.5;"/><path d="M1004,270 L1004,280 L1014,280 L1004,270" fill="#17A2B8" style="stroke:#117A8B;stroke-width:0.5;"/><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="125.625" x="808" y="282.7002">The refusals are the feature:</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="146.7334" x="808" y="292.7002">a contract whose price carries no</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="143.3936" x="808" y="302.7002">volatility information gets iv: null,</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="128.4131" x="808" y="312.7002">counted in counts.without_iv.</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="161.7627" x="808" y="322.7002">A guessed volatility would produce a</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="160.083" x="808" y="332.7002">complete, fictional Greek ladder that</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="191.2158" x="808" y="342.7002">looks exactly as authoritative as a real one.</text><g class="message" data-entity-1="part3" data-entity-2="part3" data-source-line="26" id="msg7"><line style="stroke:#000000;stroke-width:1;" x1="499.3955" x2="541.3955" y1="371" y2="371"/><line style="stroke:#000000;stroke-width:1;" x1="541.3955" x2="541.3955" y1="371" y2="384"/><line style="stroke:#000000;stroke-width:1;" x1="500.3955" x2="541.3955" y1="384" y2="384"/><polygon fill="#000000" points="510.3955,380,500.3955,384,510.3955,388,506.3955,384" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="180.1172" x="506.3955" y="366.7002">validate against chain_snapshot schema</text></g><g class="message" data-entity-1="part3" data-entity-2="part6" data-source-line="27" id="msg8"><polygon fill="#000000" points="915.3567,414,925.3567,418,915.3567,422,919.3567,418" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;" x1="499.3955" x2="921.3567" y1="418" y2="418"/><text fill="#000000" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="133.3887" x="506.3955" y="403.7002">atomic write, tmp then replace</text><text fill="#000000" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="119.4824" x="506.3955" y="413.7002">(previous file archived first)</text></g><g class="message" data-entity-1="part3" data-entity-2="part2" data-source-line="28" id="msg9"><polygon fill="#000000" points="289.6182,438,279.6182,442,289.6182,446,285.6182,442" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2,2;" x1="283.6182" x2="498.3955" y1="442" y2="442"/><text fill="#000000" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="196.7773" x="295.6182" y="437.7002">{artifact, contracts, with_iv, degraded, notes}</text></g><g class="message" data-entity-1="part2" data-entity-2="part1" data-source-line="29" id="msg10"><polygon fill="#000000" points="54.373,462,44.373,466,54.373,470,50.373,466" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2,2;" x1="48.373" x2="277.6182" y1="466" y2="466"/><text fill="#000000" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="70.5615" x="60.373" y="461.7002">JSON summary</text></g><path d="M5,479 L5,529 L967,529 L967,489 L957,479 L5,479" fill="#17A2B8" style="stroke:#117A8B;stroke-width:0.5;"/><path d="M957,479 L957,489 L967,489 L957,479" fill="#17A2B8" style="stroke:#117A8B;stroke-width:0.5;"/><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="361.3477" x="298.6422" y="491.7002">degraded and notes are different fields. Degraded: the output is lower quality than</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="340.2148" x="298.6422" y="501.7002">the pipeline can produce (provider fell back, rate not fetched, engine absent).</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="365.7422" x="298.6422" y="511.7002">Notes: ordinary observations. Collapsing them would make every artifact degraded</text><text fill="#FFFFFF" font-family="Helvetica" font-size="10" lengthAdjust="spacing" textLength="100.0586" x="298.6422" y="521.7002">and the flag worthless.</text><g class="caption" data-source-line="38"><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="614.708" x="201.7539" y="626.7803">Reproducible from shell/tests/tes