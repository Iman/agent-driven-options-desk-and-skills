[project]
name = "optiondesk-agent"
version = "0.2.0"
description = "LangChain bindings for the option desk: tools, artifact retrieval, and a grounded answer chain"
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "Iman Samizadeh" }]
dependencies = ["langchain-core>=0.3", "optiondesk"]

[project.optional-dependencies]
graph = ["langgraph>=0.2"]
dev = ["pytest", "langgraph>=0.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/optiondesk_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
